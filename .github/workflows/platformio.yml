name: ESP32 Release
on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      
      - name: Build ESP32-S3 Firmware
        run: pio run -e esp32s3-n16r8
      
      - name: Prepare Firmware Files
        run: |
          mkdir -p bin
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin bin/firmware_esp32s3.bin
          ls -lh bin/
      
      - name: Generate Version
        id: version
        run: |
          VERSION="si-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated: $VERSION"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Firmware ${{ steps.version.outputs.version }}
          files: bin/*.bin
          body: |
            ## Firmware Build
            
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            
            **Enthält:**
            - `firmware_esp32s3.bin` - esp32s3-n16r8
            
            **Flash-Anleitung:**
            ```bash
            
            # ESP32-S3
            esptool.py --chip esp32s3 write_flash 0x0 firmware_esp32s3.bin
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
