name: ESP32 Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO und esptool installieren
        run: pip install --upgrade platformio esptool

      - name: Version festlegen
        id: version
        run: |
          VERSION="si-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Firmware und Dateisystem bauen
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pio run -e esp32s3-n16r8
          pio run -e esp32s3-n16r8 -t buildfs

      - name: Release-Dateien erzeugen
        run: python tools/release.py bin "${{ steps.version.outputs.version }}"

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Firmware ${{ steps.version.outputs.version }}
          files: bin/*
          body: |
            ## Skiscanner Firmware ${{ steps.version.outputs.version }}

            **Commit:** `${{ github.sha }}`

            Am einfachsten über den Webflasher (GitHub Pages dieses Repos) flashen.

            **Neuinstallation** (löscht alles, danach Einrichtung über den WLAN `Skiscanner-Config`):
            ```bash
            esptool.py --chip esp32s3 erase_flash
            esptool.py --chip esp32s3 write_flash 0x0 scanner_vollstaendig.bin
            ```

            **Update** (Einstellungen bleiben erhalten):
            ```bash
            esptool.py --chip esp32s3 write_flash 0xe000 boot_app0.bin 0x10000 firmware.bin 0xc91000 littlefs.bin
            ```
            Oder über die Konfigurationsseite des Scanners: `firmware.bin` und `littlefs.bin` hochladen.

      - name: Seite für GitHub Pages zusammenstellen
        run: |
          mkdir -p site/firmware
          cp -r webflasher/. site/
          cp bin/manifest.json bin/bootloader.bin bin/partitions.bin bin/boot_app0.bin bin/firmware.bin bin/littlefs.bin site/firmware/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Webflasher veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
